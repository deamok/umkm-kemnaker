server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Jangan cache HTML sama sekali
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Jangan cache JS dan CSS
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # File statis lainnya boleh di-cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
    }

    # Proxy ke Evolution API (hindari CORS - request dikirim dari server, bukan browser)
    location /wa-api/ {
        proxy_pass https://wa.cilebut-one.cloud/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host wa.cilebut-one.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, apikey";
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
